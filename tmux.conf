bind r source-file ~/.config/tmux/tmux.conf
setw -g mode-keys vi

# Kill panes without confirming
bind-key & kill-window
bind-key x kill-pane

set -g mouse on
set -g base-index 1
set-option -g detach-on-destroy off
set -g default-terminal "screen-256color"
set -g automatic-rename-format '#{s/^[.]//;b:pane_current_path}'
# Indexed, not -a: appending adds another copy on every prefix+r reload.
set -s 'terminal-overrides[1]' 'xterm*:Tc'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto' # keybind = prefix + tab
set -g @plugin 'tmux-plugins/tmux-continuum' # must stay last in the plugin list
set-window-option -g window-style fg=terminal,bg=terminal


# resurrect: bring AI-agent panes back after a reboot.
# The ~ prefix matches anywhere in the pane's full command line; the post-save
# hook rewrites each agent pane's saved command to resume its exact session
# (claude --resume <uuid>, opencode -s <ses_...>) instead of starting empty.
set -g @resurrect-processes '"~claude" "~opencode"'
set -g @resurrect-hook-post-save-layout '~/.config/tmux/resurrect-agents.sh'
# nvim needs no strategy here: a restored pane runs plain `nvim` in its saved
# directory, and lua/user/obsession.lua reloads that directory's session itself.

# continuum: saves every 15 min by default, so a crash without a manual
# prefix+C-s still recovers; restore automatically when the tmux server starts.
set -g @continuum-restore 'on'

set -g @show_path_in_status "off"

# tmux url
# Card look for plugin popups (URL picker, extrakto); see popup-plugins.sh.
# No tmux border by default: every popup is drawn as a card by fzf (with -B)
# or sets its own (-b rounded for rename); extrakto can't pass -B itself.
set -g popup-border-lines none
# tmux 3.8 defaults popups to bg=themedarkgrey; keep the terminal background.
set -g popup-style 'bg=terminal'
set -g popup-border-style 'bg=terminal'
run-shell "bash ~/.config/tmux/popup-plugins.sh"
set -g @fzf-url-history-limit '2000'

run '~/.config/tmux/plugins/tpm/tpm'

# Option+h/j/k/l pane navigation with vim awareness
# Frees Ctrl+h/j/k/l for tools inside panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# tmux's own copy-mode-vi defaults for these two (cursor-left, copy-pipe-and-cancel).
unbind -T copy-mode-vi C-h
unbind -T copy-mode-vi C-j

bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"
bind-key -n M-\\ if-shell "$is_vim" "send-keys M-\\" "select-pane -l"

# Option+Shift+h/j/k/l resize focused pane by 5 cells.
bind-key -n M-H resize-pane -L 5
bind-key -n M-J resize-pane -D 5
bind-key -n M-K resize-pane -U 5
bind-key -n M-L resize-pane -R 5

bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R
bind-key -T copy-mode-vi M-\\ select-pane -l

# Fast window workflow
bind-key -r H swap-window -t -1 \; select-window -t -1
bind-key -r L swap-window -t +1 \; select-window -t +1
bind-key R run-shell -b "bash ~/.config/tmux/rename-window.sh '#{window_id}' '#{client_name}'"
bind-key ? display-popup -E -B -w 75% -h 70% "bash ~/.config/tmux/keybinds-help.sh"
bind-key w run-shell -b "bash ~/.config/tmux/window-menu.sh"
bind-key W run-shell -b "bash ~/.config/tmux/window-menu.sh"
# tmux-fzf binds prefix+F to its main menu on load; not used (window-menu.sh covers windows).
unbind-key F
bind-key a run-shell -b "bash ~/.config/tmux/sesh-picker.sh '#{client_name}'"
bind-key P if-shell -F '#{==:#{@show_path_in_status},off}' 'set -g @show_path_in_status on; display-message "status path: shown"' 'set -g @show_path_in_status off; display-message "status path: hidden"'

# Window manager mode: prefix + g then h/j/k/l/r/n/f/q
bind-key g switch-client -T winmgr \; display-message "winmgr: h/l swap left/right | j/k prev/next | r rename | n renumber | f fzf | q exit"
bind-key -T winmgr h swap-window -t -1 \; select-window -t -1 \; switch-client -T winmgr
bind-key -T winmgr l swap-window -t +1 \; select-window -t +1 \; switch-client -T winmgr
bind-key -T winmgr j previous-window \; switch-client -T winmgr
bind-key -T winmgr k next-window \; switch-client -T winmgr
bind-key -T winmgr r run-shell -b "bash ~/.config/tmux/rename-window.sh '#{window_id}' '#{client_name}'" \; switch-client -T winmgr
bind-key -T winmgr n move-window -r \; display-message "windows renumbered" \; switch-client -T winmgr
bind-key -T winmgr f run-shell -b "bash ~/.config/tmux/window-menu.sh" \; switch-client -T winmgr
bind-key -T winmgr q switch-client -T prefix
bind-key -T winmgr Escape switch-client -T prefix
bind-key -T winmgr Enter switch-client -T prefix

# session picker (Cmd+O): switch/create views, Tab toggles; see session-picker.sh
bind-key o run-shell -b "bash ~/.config/tmux/session-picker.sh '#{client_name}'"

# Colors from the Catppuccin Mocha palette (the plugin was removed; these are
# the styles it used to set).
set -g message-style 'fg=#89dceb,bg=#313244,align=centre'
set -g message-command-style 'fg=#89dceb,bg=#313244,align=centre'
setw -g mode-style 'fg=#f5c2e7 bg=#585b70 bold'
setw -g pane-border-style 'fg=#313244'
setw -g pane-active-border-style '#{?pane_in_mode,fg=#f9e2af,#{?pane_synchronized,fg=#cba6f7,fg=#fab387}}'
setw -g clock-mode-colour '#89b4fa'
# tmux's own menus (right-click, prefix+< / >) in the popup card colors
# (popup-theme.sh): rounded dim border, grey rows, surface0 selection band.
set -g menu-style 'fg=#7f849c,bg=terminal'
set -g menu-selected-style 'fg=#bac2de,bg=#313244'
set -g menu-border-style 'fg=#313244'
set -g menu-border-lines rounded

# Plain status bar on the transparent terminal background.
# status-right keeps continuum's autosave hook, which must stay in the status line.
set -g status-style 'bg=terminal,fg=#6c7086'
set -g status-bg terminal
set -g status-left ''
set -g status-right-length 100
set -g status-right '#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)   #{?#{==:#{@show_path_in_status},on},#{pane_current_path}  ,}#S '
set -g window-status-separator '  '
set -g window-status-format '#[fg=#6c7086]#I #W'
set -g window-status-current-format '#[fg=#fab387]#I #[fg=#cdd6f4,bold]#W'

# Window list shows only while Cmd is held (cmd-hold-watch LaunchAgent drives cmd-hold.sh)
run-shell "bash ~/.config/tmux/cmd-hold.sh off"

# agent session switcher: claude-code + opencode + Pi (sesh moved to prefix+a)
bind-key "K" display-popup -E -B -w 85% -h 75% "bash ~/.config/tmux/agent-switcher.sh"
